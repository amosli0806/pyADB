# 发版工作流：推 v* tag 自动打包并创建 GitHub Release。
#
# 为什么这么做：本地不需要任何 GitHub 凭据 —— 推 tag 用的是你已有的 git 推送权限，
# 打包和创建 Release 由 runner 上的 GITHUB_TOKEN 完成（workflow 里已声明 contents: write）。
#
# 产出的资产名必须和客户端更新器一致：
#   bugcatcher-<版本>-win64.zip   （内含 捕虫师/ 目录，onedir 整包）
# src/core/updater.py 里 ASSET_PREFIX / ASSET_SUFFIX 改了就同步改这里。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v2.3.0，必须已存在）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要历史 tag 供 generate-notes 使用
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 校验 tag 与 APP_VERSION 一致
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER=$(grep -oP 'APP_VERSION = "\K[^"]+' src/utils/version.py)
          echo "tag=$TAG  APP_VERSION=$VER"
          if [ "${TAG#v}" != "$VER" ]; then
            echo "::error::tag 与 src/utils/version.py 的 APP_VERSION 不一致，请先改版本号再打 tag"
            exit 1
          fi

      - name: 打包（onedir）
        run: python -m PyInstaller main.spec --noconfirm --distpath dist_release --workpath build_release

      - name: 生成 zip
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          # 用 Python 而非 Compress-Archive：中文目录名会带 UTF-8 标志位，
          # 客户端的 zipfile 才能正确解出「捕虫师/」这一层
          python -c "
          import shutil, sys
          ver = sys.argv[1]
          shutil.make_archive(f'bugcatcher-{ver}-win64', 'zip',
                              root_dir='dist_release', base_dir='捕虫师')
          " "$VER"
          ls -lh *.zip

      - name: 生成增量补丁（对比上一个 Release；失败只跳过，不阻塞发版）
        id: mkpatch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^{}" 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            echo "没有上一个 tag，跳过增量补丁"; echo "patch=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PREV="${PREV_TAG#v}"
          rm -rf prev_dl prev_tree; mkdir -p prev_dl prev_tree
          if ! gh release download "$PREV_TAG" --pattern 'bugcatcher-*-win64.zip' --dir prev_dl --clobber; then
            echo "拿不到上一个 Release 的全量包，跳过"; echo "patch=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PREV_ZIP="$(ls prev_dl/bugcatcher-*-win64.zip 2>/dev/null | head -1 || true)"
          [ -z "$PREV_ZIP" ] && { echo "上一个 Release 无全量包"; echo "patch=" >> "$GITHUB_OUTPUT"; exit 0; }
          python -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$PREV_ZIP" prev_tree
          # 上一个包解压后多一层「捕虫师/」，本次 --new-tree 直接指向 dist_release/捕虫师
          OLD_TREE="prev_tree/捕虫师"
          [ -d "$OLD_TREE" ] || OLD_TREE="prev_tree"
          PATCH_OUT="patch-${PREV}-to-${VER}.dpatch"
          if ! python tools/make_update_patch.py \
                 --old-tree "$OLD_TREE" --new-tree "dist_release/捕虫师" \
                 --from "$PREV" --to "$VER" --out "$PATCH_OUT"; then
            echo "补丁没生成（不够小 / 输入异常），跳过 —— 不影响全量发版"
            echo "patch=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "patch=$PATCH_OUT" >> "$GITHUB_OUTPUT"

      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          ASSET="bugcatcher-${VER}-win64.zip"
          PATCH="${{ steps.mkpatch.outputs.patch }}"
          FILES="$ASSET"
          if [ -n "$PATCH" ] && [ -f "$PATCH" ]; then
            FILES="$FILES $PATCH"
            echo "同时上传增量补丁：$PATCH"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "捕虫师 $TAG" \
              --generate-notes
          fi
